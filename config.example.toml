# HL-Mem 常用配置示例。
# 未列出的字段使用代码默认值；完整字段见 docs/configuration.md。
# 复制为当前工作目录下的 hl_mem.toml 后再启动服务。
schema_version = 1

[database]
path = "var/hl_mem.db"
pool_size = 8
busy_timeout_seconds = 30

[llm]
provider = "dashscope"
base_url = "https://coding.dashscope.aliyuncs.com/v1"
model = "qwen3.7-plus"
structured_mode = "json_object"
timeout = 90
max_attempts = 3

[embedding]
mode = "real"
base_url = "https://dashscope.aliyuncs.com"
model = "qwen3.7-text-embedding"
dim = 2048
api_mode = "native"

[reranker]
# 可选增强；默认关闭。
mode = "off"
base_url = "https://dashscope.aliyuncs.com"
model = "qwen3-rerank"

[image_describer]
# 可选扩展；默认关闭。
mode = "off"
provider = "dashscope"
base_url = "https://coding.dashscope.aliyuncs.com/v1"
model = "qwen3.7-plus"
timeout_seconds = 20.0

[extraction]
mode = "llm"
pre_filter = false
chunk_target_chars = 12000
# Larger/longer microbatches reduce LLM call cost but increase extraction latency.
batch_max_events = 5
batch_max_wait_seconds = 120.0
verification_mode = "off"
# E3 v2 已封存；只记录 grounded lesson signal，不替换旧 notability prompt。
lesson_signal_mode = "observe"

[index]
# natural 仅索引 subject 与原语言 value，避免内部 predicate/slot/tag 模板噪声。
text_mode = "natural"
text_version = "v2"

[recall]
default_limit = 5
vector_scan_limit = 200
dense_enabled = true
# E4 行为门禁通过但证据等级不足；只跑 shadow，不在 RRF 前硬过滤。
entity_constraint_mode = "observe"
dedup_threshold = 0.95
dedup_candidate_limit = 100
# 自动复活会改变可见状态，必须显式启用。
resurrection_mode = "off"
resurrection_candidate_limit = 3
resurrection_min_term_coverage = 0.8
packed_context_token_budget = 2000
query_expansion_mode = "off"
query_expansion_model = "glm-4.7"
# Leave both fields and QUERY_EXPANSION_API_KEY unset to inherit the [llm] line.
# For an independent line, set both fields and add QUERY_EXPANSION_API_KEY to .env.
# query_expansion_provider = "dashscope"
# query_expansion_base_url = "https://coding.dashscope.aliyuncs.com/v1"
query_expansion_timeout_seconds = 15.0
query_expansion_total_timeout_seconds = 16.0
tag_channel_enabled = false
relevance_gate_mode = "observe"
relevance_reranker_floor = 0.15
relevance_dense_floor = 0.3
relevance_relative_drop = 0.30
relevance_keep_top1 = true
relevance_intents = ["current_state"]
fts_language = "auto"

[dedup]
enabled = true
threshold = 0.92
# E2 v2 的 0.98/0.99 臂均未达到精度门禁，保持只审计。
audit_only = true
auto_merge_min_confidence = 0.98
scan_limit = 200
cron = "03:00"
max_pending_pairs = 10000

[retention]
temporal_ttl_days_low = 3
temporal_ttl_days_normal = 7
temporal_ttl_days_high = 14
operational_cleanup_enabled = true
operational_batch_size = 2000
job_succeeded_days = 30
job_dead_days = 90
llm_span_days = 30
dedup_pair_days = 90
feedback_uninjected_days = 7
feedback_unlabeled_days = 90

[decay]
# 三臂 A/B 胜出臂；日常衰减只更新 activation，confidence 保持证据强度语义。
model = "activation_halflife"
temporal_half_life_days = 45
permanent_half_life_days = 90
identity_half_life_days = 365
halflife_archive_threshold = 0.05
halflife_archive_grace_days = 7

[worker]
poll_interval = 2.0
maintenance_interval = 600
job_lease_minutes = 5
daily_token_limit = 500000  # set 0 to disable limit
conflict_auto_resolve_enabled = true
conflict_maintenance_max_cases = 50
conflict_maintenance_budget_ms = 1000
conflict_failure_backoff_seconds = 300
conflict_writer_yield_ms = 5
conflict_auto_resolve_max_candidates = 8

[conflict]
# 只执行确定性 L0；未命中规则的灰区案进入 manual_required。
auto_mode = "l0_only"

[price]
# E6 B 臂通过：只对 exact code / typed alias 的现有 instrument ID 落地。
target_mode = "enforce"

[plan]
# E5 A 臂通过：严格确定性坐标匹配可关闭 plan valid time。
fulfillment_mode = "enforce"

[state]
# ADR-0004 默认仅审计 config.version 的确定性 latest-wins 建议；发布门禁通过前不改 claim 状态。
latest_wins_mode = "observe"
latest_wins_slots = ["config.version"]

[relation]
discovery_mode = "off"

[plugins]
enabled = []

[hermes]
enabled = false
url = "http://127.0.0.1:8200"
timeout = 30
manual_conflict_notice = true
# 按需召回可能触发 query expansion LLM；默认 8 秒不改变纯检索 <2 秒目标。
on_demand_recall_timeout_seconds = 8.0
