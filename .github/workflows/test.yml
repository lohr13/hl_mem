name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Static and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Run static checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen black --check .
          uv run --frozen isort --check-only .
          uv run --frozen python -m mypy src/hl_mem/ --ignore-missing-imports
      - name: Run stable-contract checks
        run: |
          uv run --frozen python scripts/check_actions_pinned.py
          uv run --frozen python scripts/check_imports.py
          uv run --frozen python scripts/check_config_schema_snapshot.py
          uv run --frozen python scripts/check_provider_plugin_api.py
          uv run --frozen python scripts/check_ops_report_schema.py
          uv run --frozen python scripts/check_openapi_snapshot.py
          uv run --frozen python scripts/check_mcp_snapshot.py
          uv run --frozen python scripts/check_docs_consistency.py
          uv run --frozen python scripts/check_complexity_budget.py --ratchet

  core-tests:
    name: Core tests (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Run core suite once
        env:
          HL_MEM_ENV: test
        run: >-
          uv run --frozen python -W error::ResourceWarning -m pytest tests/
          -m "not release_only" -n 4 -q --tb=short
          --cov=hl_mem --cov-report=term-missing --cov-fail-under=80

  quality:
    name: Recall gate and quality smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Run required public recall contract
        run: uv run --frozen python -m tests.eval.ci_gate
      - name: Run quality smoke
        run: uv run --frozen python scripts/run_quality_smoke.py

  state-full-chain-smoke:
    name: State full-chain smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.3.2, Node 24
      - name: Install dependencies with sqlite-vec
        run: uv sync --frozen --extra sqlite-vec
      - name: Run production-to-scorer state seam smoke
        env:
          PYTHONPATH: /host/pythonpath/must-not-leak
          PYTHONHOME: /host/pythonhome/must-not-leak
          VIRTUAL_ENV: /host/venv/must-not-leak
          CONDA_PREFIX: /host/conda/must-not-leak
        run: bash scripts/hlmem-eval-python.sh -m hl_mem.evaluation.smoke_full_chain
