name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  fast:
    name: Fast contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Run static and stable-contract checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen python scripts/check_imports.py
          uv run --frozen python scripts/check_config_schema_snapshot.py
          uv run --frozen python scripts/check_provider_plugin_api.py
          uv run --frozen python scripts/check_openapi_snapshot.py
          uv run --frozen python scripts/check_mcp_snapshot.py
      - name: Run focused release contracts
        run: |
          uv run --frozen python -m tests.eval.ci_gate
          uv run --frozen python -m pytest tests/release/test_migration_release_gate.py tests/unit/test_config_loader.py tests/unit/test_provider_registry.py tests/unit/test_request_size_limit.py tests/unit/test_phase5_api_contract.py tests/unit/test_phase5_extraction_contract.py tests/unit/test_phase5_recall_contract.py -q --tb=short

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run full test suite
        env:
          HL_MEM_ENV: test
        run: |
          uv run --frozen python -W error::ResourceWarning -m pytest tests/ -q --tb=short --cov=hl_mem --cov-report=term-missing --cov-fail-under=80
      - name: Run migration upgrade test
        run: uv run --frozen python -m pytest tests/test_migration_upgrade.py -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - run: uv run --frozen python -m mypy src/hl_mem/ --ignore-missing-imports

  quality-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/run_quality_smoke.py

  state-full-chain-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - name: Install dependencies with sqlite-vec
        run: uv sync --frozen --extra sqlite-vec
      - name: Run production-to-scorer state seam smoke
        env:
          PYTHONPATH: /host/pythonpath/must-not-leak
          PYTHONHOME: /host/pythonhome/must-not-leak
          VIRTUAL_ENV: /host/venv/must-not-leak
          CONDA_PREFIX: /host/conda/must-not-leak
        run: bash scripts/hlmem-eval-python.sh -m hl_mem.evaluation.smoke_full_chain

  recall-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Run required public recall contract
        run: uv run --frozen python -m tests.eval.ci_gate

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Check formatting
        run: |
          uv run --frozen black --check .
          uv run --frozen isort --check-only .
      - name: Check complexity budget
        run: uv run --frozen python scripts/check_complexity_budget.py --ratchet

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Build wheel and source distribution
        run: uv run --frozen python -m build
      - name: Verify wheel contents
        run: uv run --frozen python scripts/check_wheel_contents.py --reject-v030 dist/*.whl
      - name: Verify import in a clean environment
        run: |
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install dist/*.whl
          .build-venv/bin/python -c "import hl_mem; print(hl_mem.__version__)"
          .build-venv/bin/hl-mem --version
          .build-venv/bin/hl-mem config migrate --help
          .build-venv/bin/hl-mem doctor --help

  migrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Verify empty, historical, and repeated migrations
        run: uv run --frozen python -m pytest tests/release/test_migration_release_gate.py tests/test_migration_upgrade.py -q --tb=short

  import-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Check dependency direction
        run: uv run --frozen python scripts/check_imports.py

  doc-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_docs_consistency.py

  contract-snapshots:
    # NOTE: Snapshot mismatch means contract changed.
    # Reviewers must verify this is intentional before approving.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Check config, Provider, OpenAPI, and MCP contracts
        run: |
          uv run --frozen python scripts/check_config_schema_snapshot.py
          uv run --frozen python scripts/check_provider_plugin_api.py
          uv run --frozen python scripts/check_openapi_snapshot.py
          uv run --frozen python scripts/check_mcp_snapshot.py

  provider-plugin-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen
      - name: Build and install an external Provider wheel
        run: uv run --frozen python -m pytest tests/integration/test_provider_plugin_wheel.py -q --tb=short
