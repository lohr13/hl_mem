name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: python
      - uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9

  dependencies:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v8.3.2, Node 24
      - name: Export locked runtime dependencies
        run: |
          mkdir -p security-artifacts
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements.txt --output-file security-artifacts/requirements.txt
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit --strict
          --requirement security-artifacts/requirements.txt --format json
          --output security-artifacts/pip-audit.json
      - name: Generate validated CycloneDX SBOM
        if: always()
        run: >-
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py requirements security-artifacts/requirements.txt
          --pyproject pyproject.toml --mc-type application --spec-version 1.6
          --output-reproducible --output-format JSON --output-file security-artifacts/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-supply-chain-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: warn
      - name: Enforce dependency audit result
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          test "$AUDIT_OUTCOME" = "success"
          python - <<'PY'
          from pathlib import Path
          from scripts.write_release_evidence import validate_pip_audit

          result = validate_pip_audit(Path("security-artifacts/pip-audit.json"))
          print(f"pip-audit passed for {result['dependencies']} dependencies")
          PY

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
