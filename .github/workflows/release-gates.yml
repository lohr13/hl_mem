name: Core 1.0 release gates

on:
  workflow_dispatch:
  push:
    tags:
      - "v*rc*"

permissions:
  contents: read

jobs:
  python:
    name: Core tests (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: python scripts/check_actions_pinned.py
      - run: uv sync --frozen --extra sqlite-vec
      - name: Run core suite once
        env:
          HL_MEM_ENV: test
        run: |
          mkdir -p evidence
          uv run --frozen python -W error::ResourceWarning -m pytest tests/ \
            -m "not release_only" -n 4 -q --tb=short \
            --cov=hl_mem --cov-report=term-missing --cov-fail-under=80 \
            --junitxml=evidence/python-3.13.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-python-3.13
          path: evidence/
          if-no-files-found: error

  operational:
    name: Operational release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - run: uv sync --frozen --extra sqlite-vec
      - name: Run release-only validation once
        run: |
          mkdir -p evidence
          uv run --frozen python -m pytest tests/ -m release_only -q --tb=short \
            --junitxml=evidence/release-only.xml
      - name: Verify public recall gate
        run: uv run --frozen python -m tests.eval.ci_gate --report evidence/public-recall.json
      - name: Build and install distributions
        run: |
          uv run --frozen python -m build
          uv run --frozen python scripts/check_wheel_contents.py --reject-v030 dist/*.whl
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -c "import hl_mem; print(hl_mem.__version__)"
          .release-venv/bin/hl-mem --version
          .release-venv/bin/hl-mem config migrate --help
          .release-venv/bin/hl-mem doctor --help
          python -c "from pathlib import Path; Path('evidence/wheel-install.xml').write_text('<testsuite name=\"wheel-install\" tests=\"1\" failures=\"0\" errors=\"0\" skipped=\"0\"/>', encoding='utf-8')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-operational
          path: evidence/
          if-no-files-found: error

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, Node 24
      - name: Export locked runtime dependencies
        run: |
          mkdir -p evidence
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements.txt --output-file evidence/requirements.txt
      - name: Audit locked dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit --strict
          --requirement evidence/requirements.txt --format json --output evidence/pip-audit.json
      - name: Generate validated CycloneDX SBOM
        run: >-
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py requirements evidence/requirements.txt
          --pyproject pyproject.toml --mc-type application --spec-version 1.6
          --output-reproducible --output-format JSON --output-file evidence/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-supply-chain
          path: evidence/
          if-no-files-found: error

  evidence:
    name: Validate release evidence
    if: always()
    needs: [python, operational, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: evidence
          merge-multiple: true
      - name: Validate and aggregate evidence
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RELEASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/write_release_evidence.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --run-url "$RELEASE_RUN_URL" \
            --output-dir evidence/manifest \
            --junit python-3.13=evidence/python-3.13.xml \
            --junit release-only=evidence/release-only.xml \
            --json public-recall=evidence/public-recall.json \
            --json pip-audit=evidence/pip-audit.json \
            --file sbom=evidence/sbom.cdx.json \
            --junit wheel-install=evidence/wheel-install.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error
