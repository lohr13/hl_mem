[project]
name = "hl-mem"
version = "0.23.1"
description = "Evidence-aware local memory service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jieba==0.42.1",
    "numpy>=2.0",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
sqlite-vec = ["sqlite-vec>=0.1.9,<0.2"]

[project.urls]
Homepage = "https://github.com/lohr13/hl_mem"
Repository = "https://github.com/lohr13/hl_mem"
Changelog = "https://github.com/lohr13/hl_mem/blob/main/docs/CHANGELOG.md"

[project.scripts]
hl-mem = "hl_mem.cli:main"
hlmem = "hl_mem.cli:main"
hl-mem-worker = "hl_mem.workers.worker:main"
hl-mem-mcp = "hl_mem.mcp.runtime:main"

[dependency-groups]
dev = [
    "black>=24.0",
    "build>=1.2",
    "isort>=5.13",
    "mcp>=2,<3",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=0.5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 300
timeout_method = "thread"
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "benchmark: performance benchmarks excluded from default test discovery by file naming",
    "eval: offline evaluation tests that report metrics without enforcing quality thresholds",
]

[tool.coverage.run]
source = ["src/hl_mem"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
skip_glob = [".build-venv/*", "**/storage/experience.py"]

[tool.ruff.lint]
select = ["E9", "E4", "E7", "F", "I"]

[tool.ruff]
exclude = [".build-venv", "var", "evaluation/results"]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/hl_mem/storage/experience.py" = ["I001"]

[tool.ruff.format]
# Black 是 CI 的唯一代码格式化器；避免 Ruff 与 Black 对字符串拼接及 Markdown 代码块反复改写。
exclude = ["*.md", "*.py", "*.pyi"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hl_mem.core.*"
strict = true

[[tool.mypy.overrides]]
module = "hl_mem.domain.*"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/hl_mem"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.env",
    "/.build-venv",
    "/.git",
    "/.github",
    "/.gitignore",
    "/hl_mem.toml",
    "/hl_mem.toml.bak*",
    "/var",
    "/docs/tasks",
    "/evaluation",
]
